{{- if .Values.gateway.enabled }}
{{- $key := required "platform.gatewayMasterKey is required: the gateway's admin credential must be supplied explicitly, never defaulted" .Values.platform.gatewayMasterKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.masterkeySecretName }}
  labels:
    {{- include "chimes.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.gateway.masterkeySecretKey }}: {{ $key | quote }}
{{- end }}
